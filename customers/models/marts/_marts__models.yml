version: 2

models:
  - name: fct_orders
    description: "One row per order, with totals, payment status and a revenue flag."
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: order_total
        data_tests: [positive_value]
      - name: payment_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['paid', 'partial', 'unpaid']
  - name: dim_customers
    description: "One row per customer with lifetime value and segment."
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: customer_segment
        data_tests:
          - accepted_values:
              arguments:
                values: ['high', 'medium', 'low', 'no_purchases']
  - name: fct_daily_revenue
    description: "Revenue and order counts per day."
    columns:
      - name: order_date
        data_tests: [unique, not_null]
      - name: revenue
        data_tests: [positive_value]
  - name: meta_last_build
    description: "One row: when this project last finished building. Read by downstream projects."
    columns:
      - name: built_at
        data_tests: [not_null]
