version: 2

models:
  - name: stg_customers
    description: "Cleaned customers: lower-cased email and a full_name column."
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: email
        data_tests: [not_null]
  - name: stg_products
    description: "Products with prices converted from cents to currency."
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: unit_price
        data_tests: [positive_value]
  - name: stg_orders
    description: "Orders as placed by customers."
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['placed', 'shipped', 'completed', 'cancelled', 'returned']
  - name: stg_order_items
    description: "Product lines on an order."
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: quantity
        data_tests: [positive_value]
  - name: stg_payments
    description: "Payments received against orders."
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: amount
        data_tests: [positive_value]
