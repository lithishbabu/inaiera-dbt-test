name: 'inventory'
version: '1.0.0'
config-version: 2

# The dbt Runner rewrites this to its generated profile at run time.
profile: 'inventory'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
clean-targets: ["target"]

models:
  inventory:
    staging:
      +materialized: view
    marts:
      +materialized: table
