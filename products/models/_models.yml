version: 2

models:
  - name: products_upstream_check
    description: "Fails the run when the customers project has not built in the last 5 minutes."
  - name: product_order_lines
    description: "Revenue order lines (cancelled/returned orders excluded)."
    columns:
      - name: order_item_id
        tests: [unique, not_null]
  - name: product_performance
    description: "Sales summary per product."
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: revenue
        tests: [not_null]
  - name: category_performance
    description: "Sales summary per product category."
    columns:
      - name: category
        tests: [unique, not_null]
  - name: products_last_build
    description: "Stamped when a products build finishes; read by downstream projects."
