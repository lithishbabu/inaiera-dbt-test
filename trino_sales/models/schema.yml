version: 2

models:
  - name: stg_trino_orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['placed', 'shipped', 'completed', 'cancelled', 'returned']

  - name: stg_trino_order_items
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_trino_orders')
                field: order_id

  - name: fct_trino_orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: source('warehouse', 'dim_customers')
                field: customer_id

  - name: product_sales_trino
    columns:
      - name: product_id
        data_tests: [unique, not_null]

  - name: customer_orders_trino
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
