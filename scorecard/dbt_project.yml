name: 'scorecard'
version: '1.0.0'
config-version: 2

# The dbt Runner rewrites this to its generated profile at run time.
profile: 'scorecard'

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
clean-targets: ["target"]

vars:
  # Run only if the `combined` project built within this many minutes.
  combined_max_age_minutes: 7

models:
  scorecard:
    staging:
      +materialized: table
    marts:
      +materialized: table
