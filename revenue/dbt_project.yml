name: 'revenue'
version: '1.0.0'
config-version: 2

# The dbt Runner rewrites this to its generated profile at run time.
profile: 'revenue'

model-paths: ["models"]
test-paths: ["tests"]
clean-targets: ["target"]

vars:
  # Fail the run if the customers project has not built within this many minutes.
  customers_max_age_minutes: 5

models:
  revenue:
    staging:
      +materialized: view
    marts:
      +materialized: table
